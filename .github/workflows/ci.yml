name: Build (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          # pip install -r requirements_freeze.txt
          pip uninstall -y orjson
          pip uninstall -y python-magic
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          $targetFile = Join-Path $sitePackages "Lib/site-packages/PyInstaller/building/build_main.py"
          $pattern = 'child.call\(import_library, package\)'
          $insertion ='logger.info("attempting to import: %r", package)'
          $originalLine= '                    child.call(import_library, package)'
          $replacement = "$insertion`n$originalLine"
          (Get-Content $targetFile) -replace $pattern, $replacement | Set-Content $targetFile

      - name: Build with PyInstaller
        run: |
          python -m nltk.downloader punkt_tab averaged_perceptron_tagger_eng
          # pyinstaller.exe --noconsole --log-level=DEBUG --optimize 2  --icon ./resources/icon.png --add-data "./resources:resources" --contents-directory "."    --collect-all unstructured --collect-submodules scipy --collect-all requests   --noconfirm -n LocalSearch main.py
          pyinstaller LocalSearch_custom.spec
      - name: Zip dist/LocalSearch
        run: |
          powershell Compress-Archive `
            -Path dist/LocalSearch/* `
            -DestinationPath dist/LocalSearch-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSearch-Windows
          path: dist/LocalSearch-Windows.zip
          retention-days: 1

